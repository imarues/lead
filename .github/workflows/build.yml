# Checks that the tweak builds, and lets anyone with a fork get the packages from the
# run's artifacts. Publishing a release is tools/release.sh, run locally.
name: Build

permissions:
    contents: write

on:
    push:
        branches:
            - main
            - feature/virtual-media-call-test
    workflow_dispatch:

# Avoid accumulating duplicate builds of the same public main branch.
concurrency:
    group: lead-main-build
    cancel-in-progress: true

jobs:
    build:
        # Intel runner pool has separate capacity from Apple Silicon.
        # Theos still cross-compiles arm64 and arm64e iOS dylibs.
        runs-on: macos-15-intel
        steps:
            - uses: actions/checkout@v4

            - name: Set up Theos
              uses: waruhachi/theos-action@v2.4.6
              with:
                theos-src: 'waruhachi/theos'
                theos-branch: 'main'
                sdks-src: 'waruhachi/sdks'
                sdks-branch: 'main'

            # tools/package_variants.sh builds the rootless and RootHide debs with it.
            - name: Install dpkg
              run: brew install dpkg

            - name: Build packages
              shell: bash
              run: make clean package FINALPACKAGE=1

            - name: Upload packages
              uses: actions/upload-artifact@v4
              with:
                name: lead-packages
                path: |
                    packages/*.deb
                    packages/Lead.dylib

            # Publish the compiled binary, not an artifact ZIP, for sideload users.
            # The separate branch is excluded from the push trigger, avoiding CI loops.
            - name: Publish standalone Lead.dylib
              if: github.ref == 'refs/heads/feature/virtual-media-call-test'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  test -s packages/Lead.dylib
                  if ! gh api "repos/${GITHUB_REPOSITORY}/branches/compiled-lead" >/dev/null 2>&1; then
                      gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                          -f ref='refs/heads/compiled-lead' -f sha="${GITHUB_SHA}" >/dev/null
                  fi
                  current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/Lead.dylib?ref=compiled-lead" --jq .sha 2>/dev/null || true)"
                  base64 < packages/Lead.dylib | tr -d '\n' > "${RUNNER_TEMP}/Lead.b64"
                  jq -n --rawfile encoded "${RUNNER_TEMP}/Lead.b64" \
                      --arg message "Build Lead.dylib from ${GITHUB_SHA}" \
                      --arg branch compiled-lead --arg sha "${current_sha}" \
                      '{message:$message,branch:$branch,content:$encoded} +
                        (if $sha == "" then {} else {sha:$sha} end)' \
                      > "${RUNNER_TEMP}/lead-payload.json"
                  gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/Lead.dylib" \
                      --input "${RUNNER_TEMP}/lead-payload.json" >/dev/null
                  echo "Direct dylib: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/compiled-lead/Lead.dylib"
