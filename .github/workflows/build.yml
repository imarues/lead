# Checks that the tweak builds, and lets anyone with a fork get the packages from the
# run's artifacts. Publishing a release is tools/release.sh, run locally.
name: Build

permissions:
    contents: write

on:
    push:
        branches:
            - main
    workflow_dispatch:

# Avoid accumulating duplicate builds of the same public main branch.
concurrency:
    group: kira-main-build
    cancel-in-progress: true

jobs:
    build:
        # Intel runner pool has separate capacity from Apple Silicon.
        # The included Go archive targets arm64, as in the experimental build.
        runs-on: macos-15-intel
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                go-version: '1.24.x'
                cache: false

            - name: Set up Theos
              uses: waruhachi/theos-action@v2.4.6
              with:
                theos-src: 'waruhachi/theos'
                theos-branch: 'main'
                sdks-src: 'waruhachi/sdks'
                sdks-branch: 'main'

            # tools/package_variants.sh builds the rootless and RootHide debs with it.
            - name: Install dpkg
              run: brew install dpkg

            - name: Test group ICE candidate and UDP relay logic
              working-directory: tools/warp
              run: go test -mod=mod -v ./...

            - name: Compile userspace WireGuard archive
              run: bash tools/warp/build.sh

            - name: Build packages with call connection bypass included
              shell: bash
              run: make clean package FINALPACKAGE=1 LEAD_WARP_ARCHIVE="$PWD/tools/warp/build/libLeadWarp.a"

            - name: Verify the integrated call tunnel
              shell: bash
              run: |
                  test -s packages/Kira.dylib
                  nm packages/Kira.dylib > "${RUNNER_TEMP}/kira-symbols.txt"
                  grep -q 'LeadWarpStart' "${RUNNER_TEMP}/kira-symbols.txt"

            - name: Upload packages
              uses: actions/upload-artifact@v4
              with:
                name: kira-packages
                path: |
                    packages/*.deb
                    packages/Kira.dylib

            # Publish the compiled binary, not an artifact ZIP, for sideload users.
            # The separate branch is excluded from the push trigger, avoiding CI loops.
            - name: Publish standalone Kira.dylib
              if: github.ref == 'refs/heads/main'
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  test -s packages/Kira.dylib
                  if ! gh api "repos/${GITHUB_REPOSITORY}/branches/compiled-kira" >/dev/null 2>&1; then
                      gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                          -f ref='refs/heads/compiled-kira' -f sha="${GITHUB_SHA}" >/dev/null
                  fi
                  current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/Kira.dylib?ref=compiled-kira" --jq .sha 2>/dev/null || true)"
                  base64 < packages/Kira.dylib | tr -d '\n' > "${RUNNER_TEMP}/Kira.b64"
                  jq -n --rawfile encoded "${RUNNER_TEMP}/Kira.b64" \
                      --arg message "Build Kira.dylib from ${GITHUB_SHA}" \
                      --arg branch compiled-kira --arg sha "${current_sha}" \
                      '{message:$message,branch:$branch,content:$encoded} +
                        (if $sha == "" then {} else {sha:$sha} end)' \
                      > "${RUNNER_TEMP}/kira-payload.json"
                  gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/Kira.dylib" \
                      --input "${RUNNER_TEMP}/kira-payload.json" >/dev/null
                  echo "Direct dylib: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/compiled-kira/Kira.dylib"
