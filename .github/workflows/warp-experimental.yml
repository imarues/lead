name: WARP experimental build
on:
  push:
    branches: [main]
    paths:
      - 'tools/warp/**'
      - 'Sources/tgapi/UI/**'
      - 'Sources/tgapi/Calls/**'
      - 'Sources/tgapi/SideloadFix.m'
      - 'Sources/tgapi/TLParser.swift'
      - 'Sources/tgapi/VideoToVoice.xm'
      - 'Sources/tgapi/Headers.h'
      - 'Makefile'
      - '.github/workflows/warp-experimental.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lead-warp-experimental
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Set up Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'waruhachi/theos'
          theos-branch: 'main'
          sdks-src: 'waruhachi/sdks'
          sdks-branch: 'main'
      - name: Install dpkg
        run: brew install dpkg
      - name: Test group ICE candidate and UDP relay logic
        working-directory: tools/warp
        run: go test -mod=mod -v ./...
      - name: Compile userspace WireGuard archive
        run: bash tools/warp/build.sh
      - name: Build experimental arm64 dylib
        shell: bash
        run: make clean package FINALPACKAGE=1 LEAD_WARP_ARCHIVE="$PWD/tools/warp/build/libLeadWarp.a"
      - name: Check exported Go symbols in dylib
        run: |
          test -s packages/Kira.dylib
          nm packages/Kira.dylib | grep -q 'LeadWarpStart'
      - uses: actions/upload-artifact@v4
        with:
          name: kira-warp-arm64
          path: packages/Kira.dylib
          if-no-files-found: error
